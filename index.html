<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamp Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
        }
        #onBtn { background-color: #4CAF50; color: white; }
        #offBtn { background-color: #f44336; color: white; }
    </style>
</head>
<body>
    <h1>Lamp Control</h1>
    <button id="onBtn" onclick="controlLamp('on')">Turn ON</button>
    <button id="offBtn" onclick="controlLamp('off')">Turn OFF</button>

    <script>
        const espIP = "192.168.x.x"; // غيّرها لـ IP بتاع الـ ESP8266 (من Serial Monitor)
        function controlLamp(state) {
            fetch(`http://${espIP}/${state}`)
                .then(response => response.text())
                .then(data => alert(data))
                .catch(error => alert("Error: " + error));
        }
    </script>
</body>
</html>
