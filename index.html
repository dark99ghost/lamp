<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LED Control</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }
    .container {
      text-align: center;
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #333;
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #45a049;
    }
    button.off {
      background-color: #f44336;
    }
    button.off:hover {
      background-color: #da190b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>LED Control</h1>
    <button id="toggleButton" onclick="toggleLED()">Turn ON</button>
  </div>

  <script>
    let isLEDOn = false;
    const button = document.getElementById('toggleButton');

    async function toggleLED() {
      isLEDOn = !isLEDOn;
      button.textContent = isLEDOn ? 'Turn OFF' : 'Turn ON';
      button.classList.toggle('off', isLEDOn);

      try {
        const response = await fetch(`/proxy?state=${isLEDOn ? 'on' : 'off'}`, {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' },
        });
        if (!response.ok) {
          console.error('Failed to connect to ESP8266');
        }
      } catch (error) {
        console.error('Error:', error);
      }
    }
  </script>
</body>
</html>
